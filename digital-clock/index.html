<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🌍 Digital Clock</h1>
        <p class="subtitle">Current Time Across Time Zones</p>
        
        <div class="controls">
            <button id="addZoneBtn" class="btn-primary">+ Add Time Zone</button>
            <button id="resetBtn" class="btn-secondary">Reset to Defaults</button>
        </div>

        <div class="clock-grid" id="clockGrid">
            <!-- Clock cards will be dynamically inserted here -->
        </div>
    </div>

    <!-- Modal for adding time zone -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add Time Zone</h2>
            <select id="timezoneSelect">
                <option value="">Select a time zone...</option>
            </select>
            <button id="confirmBtn" class="btn-primary">Add</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
